name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Zip Package
      run: |
        mkdir -p output
        zip -r output/maroon-pdf-app.zip index.html

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: maroon-pdf-release
        path: output/
