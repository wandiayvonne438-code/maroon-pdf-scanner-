name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Create Minimal Android Wrapper & Build APK
      run: |
        mkdir -p myapp/app/src/main/assets/www
        cp index.html myapp/app/src/main/assets/www/
        echo "Android project wrapper initialized for web assets."
        # If gradlew is present, build; otherwise skip to artifact pack
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Packing web assets for direct download release."
        fi

    - name: Package Web App Package
      run: |
        zip -r maroon-pdf-scanner-web.zip index.html
        mkdir -p output
        cp maroon-pdf-scanner-web.zip output/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: maroon-pdf-scanner-release
        path: output/
