name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Functional Android APK
      run: |
        npm install -g cordova
        cordova create maroon_app com.maroon.pdfscanner "Maroon PDF"
        cp index.html maroon_app/www/
        cd maroon_app
        
        # Add key Cordova plugins for file access, camera, and permissions
        cordova plugin add cordova-plugin-file
        cordova plugin add cordova-plugin-camera
        cordova plugin add cordova-plugin-android-permissions
        
        # Enable Android WebView File Access & Navigation
        sed -i '/<\/widget>/i \    <preference name="AllowInlineMediaPlayback" value="true" />\n    <preference name="AllowFileAccessFromFileURLs" value="true" />\n    <preference name="AllowUniversalAccessFromFileURLs" value="true" />\n    <preference name="AndroidInsecureFileModeEnabled" value="true" />\n    <access origin="*" />\n    <allow-navigation href="*" />' config.xml
        
        cordova platform add android
        cordova build android --no-telemetry
        
        mkdir -p ../dist
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../dist/Maroon-PDF-Scanner.apk

    - name: Upload Functional APK
      uses: actions/upload-artifact@v4
      with:
        name: Maroon-PDF-Scanner-App
        path: dist/Maroon-PDF-Scanner.apk
