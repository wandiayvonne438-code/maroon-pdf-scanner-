name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Android APK with Cordova
      run: |
        npm install -g cordova
        cordova create maroon_app com.maroon.pdfscanner "Maroon PDF"
        cp index.html maroon_app/www/
        cd maroon_app
        cordova platform add android
        cordova build android --no-telemetry
        mkdir -p ../dist
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../dist/Maroon-PDF-Scanner.apk

    - name: Upload Clean APK for Client
      uses: actions/upload-artifact@v4
      with:
        name: Maroon-PDF-Scanner-App
        path: dist/Maroon-PDF-Scanner.apk
