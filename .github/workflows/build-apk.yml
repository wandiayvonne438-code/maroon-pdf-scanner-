name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Create Web App Package
      run: |
        mkdir -p output
        zip -r output/maroon-pdf-scanner-app.zip index.html

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: maroon-pdf-scanner-release
        path: output/
