name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Package App
      run: |
        mkdir -p build-output
        zip -r build-output/maroon-pdf-app.zip index.html

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: maroon-pdf-release
        path: build-output/
